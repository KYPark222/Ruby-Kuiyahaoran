<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">ゲームプレイ用パチンコ盤面</title>
  <desc id="desc">金属と透明樹脂の多層フレーム、大型液晶、右側ボーナス表示、盤面の釘、玉の通路、始動口、下部表示で構成した盤面</desc>
