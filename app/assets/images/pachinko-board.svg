    <linearGradient id="shell" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090d12"/><stop offset=".22" stop-color="#57616a"/><stop offset=".34" stop-color="#10151a"/><stop offset=".54" stop-color="#87929a"/><stop offset=".68" stop-color="#15191e"/><stop offset=".86" stop-color="#56616a"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d9f7ff" stop-opacity=".82"/><stop offset=".2" stop-color="#8de9f0" stop-opacity=".14"/><stop offset=".55" stop-color="#fff" stop-opacity=".05"/><stop offset=".85" stop-color="#e1fbff" stop-opacity=".43"/><stop offset="1" stop-color="#fff" stop-opacity=".11"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#062538"/><stop offset=".48" stop-color="#087d9f"/><stop offset="1" stop-color="#06111c"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#0ff"/><stop offset=".5" stop-color="#36e9ff"/><stop offset="1" stop-color="#087ec2"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#7b4507"/><stop offset=".4" stop-color="#ffe27a"/><stop offset=".7" stop-color="#e99a14"/><stop offset="1" stop-color="#603507"/></linearGradient>
    <linearGradient id="bonus" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f52d2d"/><stop offset="1" stop-color="#550b16"/></linearGradient>
    <pattern id="pins" width="31" height="38" patternUnits="userSpaceOnUse"><circle cx="15" cy="17" r="6" fill="#4b2d0c"/><circle cx="14" cy="15" r="5" fill="url(#gold)" stroke="#fff1a5" stroke-width="1.2"/><circle cx="12.5" cy="13.5" r="1.4" fill="#fff8ce"/></pattern>
    <pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 9L9 0l9 9-9 9z" fill="none" stroke="#11dff1" stroke-opacity=".18" stroke-width="1"/></pattern>
